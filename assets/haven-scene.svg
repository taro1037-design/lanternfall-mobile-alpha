<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Emberlight, a painted isometric fantasy village</title>
<desc id="desc">The lantern-lit mine, cinder forge and traveler tavern on an island above the mist</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#162d4c"/><stop offset=".65" stop-color="#395a70"/><stop offset="1" stop-color="#d2a57a"/></linearGradient>
<linearGradient id="grass" x2=".3" y2="1"><stop stop-color="#7e9471"/><stop offset=".62" stop-color="#547968"/><stop offset="1" stop-color="#244f53"/></linearGradient>
<linearGradient id="wall" x2=".8" y2=".9"><stop stop-color="#f6d9a1"/><stop offset="1" stop-color="#ad8867"/></linearGradient>
<linearGradient id="roof" x2="0" y2="1"><stop stop-color="#b94e50"/><stop offset="1" stop-color="#713d52"/></linearGradient>
<linearGradient id="stone" x2=".4" y2="1"><stop stop-color="#7c8083"/><stop offset="1" stop-color="#303f57"/></linearGradient>
<radialGradient id="light"><stop stop-color="#ffeab0" stop-opacity=".95"/><stop offset=".28" stop-color="#ffc16a" stop-opacity=".4"/><stop offset="1" stop-color="#ffb86b" stop-opacity="0"/></radialGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="pebbles" width="42" height="24" patternUnits="userSpaceOnUse"><circle cx="8" cy="12" r="2" fill="#b8ae8c" opacity=".25"/><circle cx="31" cy="5" r="2" fill="#d5d09b" opacity=".25"/></pattern>
